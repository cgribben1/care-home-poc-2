; Seeed XIAO ESP32S3 Plus + Adafruit SPH0645LM4H
; Default env for current hardware.

[platformio]
default_envs = sph0645

[common_xiao_s3]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM5
monitor_port = COM5
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; XIAO ESP32S3 Plus (16MB flash) + Adafruit SPH0645 — D0/D1/D2
[env:sph0645]
extends = common_xiao_s3
board = seeed_xiao_esp32s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_src_filter = -<*> +<sph0645/>
build_flags =
    ${common_xiao_s3.build_flags}
    -DPIN_I2S_SD=1
    -DPIN_I2S_SCK=2
    -DPIN_I2S_WS=3

; Same mic — BCLK/LRCL/DOUT on D4/D5/D6 (Gemini-style wiring)
[env:sph0645_d456]
extends = env:sph0645
build_flags =
    ${common_xiao_s3.build_flags}
    -DPIN_I2S_SCK=5
    -DPIN_I2S_WS=6
    -DPIN_I2S_SD=43

; Legacy: Dollatek INMP441 on D0/D1/D2
[env:inmp441]
extends = common_xiao_s3
board = seeed_xiao_esp32s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_src_filter = -<*> +<inmp441/>

; XIAO ESP32S3 Sense built-in PDM mic (not on Plus)
[env:builtin_mic]
extends = common_xiao_s3
board = seeed_xiao_esp32s3
build_src_filter = -<*> +<builtin/>

[env:builtin_stream]
extends = common_xiao_s3
board = seeed_xiao_esp32s3
build_src_filter = -<*> +<builtin_stream/>

; INMP441 wiring debug (text only)
[env:mic_debug]
extends = common_xiao_s3
board = seeed_xiao_esp32s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_src_filter = -<*> +<mic_debug/>

; On-device CNN inference → WiFi HTTP alerts to Raspberry Pi
; Prerequisites: run train_cnn.py then convert_tflite.py to generate:
;   firmware/include/model_data.h
;   firmware/include/mel_filterbank.h
;   firmware/include/wifi_config.h   (gitignored — manual file, contains credentials)
[env:wifi_inference]
extends = common_xiao_s3
board = seeed_xiao_esp32s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<wifi_inference/>
build_flags =
    ${common_xiao_s3.build_flags}
    -DPIN_I2S_SD=1
    -DPIN_I2S_SCK=2
    -DPIN_I2S_WS=3
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
